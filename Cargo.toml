[package]
name = "soundpass-rs"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Lossless file transfer through Windows WASAPI and Linux PulseAudio loopback"
license = "GPL-3.0-only"
repository = "https://github.com/bibiparrot/bibisoundpass"

[[bin]]
name = "soundpass-send"
path = "src/bin/send.rs"

[[bin]]
name = "soundpass-recv"
path = "src/bin/recv.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
brotli = "8"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ggwave = "0.1"
hound = "3"
lzma-rs = "0.3"
raptorq = "2"
reed-solomon = "0.2"
rustfft = "6"
zstd = "0.13"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
wasapi = "0.27"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
