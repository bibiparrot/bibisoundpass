name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: "0.1.4"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse-dev pulseaudio pulseaudio-utils
      - run: cargo test --release --locked
      - name: Test Linux live loopback
        run: |
          pulseaudio --start --exit-idle-time=-1
          tests/linux_live_loopback.sh

  linux-to-windows-waveform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-to-windows-waveform
      - name: Install Linux audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse-dev
      - name: Generate waveform with the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin soundpass-send
          mkdir -p interop
          head -c 4096 /dev/urandom > interop/source.bin
          target/release/soundpass-send interop/source.bin \
            --wav interop/transfer.wav --no-play --passes 1
      - uses: actions/upload-artifact@v7
        with:
          name: linux-to-windows-waveform
          path: |
            interop/source.bin
            interop/transfer.wav
          if-no-files-found: error

  linux-to-windows-interop:
    needs: linux-to-windows-waveform
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-to-windows-interop
      - uses: actions/download-artifact@v8
        with:
          name: linux-to-windows-waveform
          path: interop
      - name: Decode Linux waveform with the Windows receiver
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --bin soundpass-recv
          New-Item -ItemType Directory -Force interop/recovered | Out-Null
          target/release/soundpass-recv.exe --input interop/transfer.wav --out interop/recovered
          $expected = (Get-FileHash interop/source.bin -Algorithm SHA256).Hash
          $actual = (Get-FileHash interop/recovered/source.bin -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Linux sender and Windows receiver hashes differ"
          }

  linux:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_arch: x86_64
            rpm_arch: x86_64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_arch: aarch64
            rpm_arch: aarch64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.artifact_arch }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse-dev librsvg2-bin
      - name: Build binaries
        run: cargo build --release --locked --bins --target "${{ matrix.target }}"
      - name: Install RPM builder
        run: sudo gem install fpm --no-document
      - name: Package Linux artifacts
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          mkdir -p dist stage pkgroot/usr/bin pkgroot/usr/share/doc/soundpass
          cp "target/$TARGET/release/soundpass-send" stage/
          cp "target/$TARGET/release/soundpass-recv" stage/
          cp README.md LICENSE stage/
          tar -C stage -czf "dist/soundpass-$VERSION-linux-$ARTIFACT_ARCH.tar.gz" .

          cp "target/$TARGET/release/soundpass-send" pkgroot/usr/bin/
          cp "target/$TARGET/release/soundpass-recv" pkgroot/usr/bin/
          cp README.md LICENSE pkgroot/usr/share/doc/soundpass/
          fpm -s dir -t rpm -C pkgroot \
            -n soundpass -v "$VERSION" -a "$RPM_ARCH" \
            --license GPL-3.0-only \
            --description "Lossless file transfer through audio" \
            --url "https://github.com/bibiparrot/bibisoundpass" \
            --depends pulseaudio-libs \
            -p "dist/soundpass-$VERSION-linux-$ARTIFACT_ARCH.rpm" .

          appdir="SoundPass-$ARTIFACT_ARCH.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/scalable/apps" "$appdir/usr/share/metainfo"
          cp "target/$TARGET/release/soundpass-send" "$appdir/usr/bin/"
          cp "target/$TARGET/release/soundpass-recv" "$appdir/usr/bin/"
          cp packaging/linux/AppRun "$appdir/AppRun"
          cp packaging/linux/soundpass "$appdir/usr/bin/soundpass"
          cp packaging/linux/soundpass.desktop "$appdir/soundpass.desktop"
          cp packaging/linux/soundpass.svg "$appdir/soundpass.svg"
          cp packaging/linux/soundpass.desktop "$appdir/usr/share/applications/"
          cp packaging/linux/soundpass.svg "$appdir/usr/share/icons/hicolor/scalable/apps/"
          mkdir -p "$appdir/usr/share/icons/hicolor/256x256/apps"
          rsvg-convert --width 256 --height 256 packaging/linux/soundpass.svg \
            --output "$appdir/soundpass.png"
          cp "$appdir/soundpass.png" "$appdir/usr/share/icons/hicolor/256x256/apps/"
          cp packaging/linux/com.bibiparrot.soundpass.metainfo.xml \
            "$appdir/usr/share/metainfo/"
          ln -s soundpass.png "$appdir/.DirIcon"
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/"*
          curl --fail --location --retry 3 \
            -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$APPIMAGE_ARCH.AppImage"
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/soundpass-send" \
            --executable "$appdir/usr/bin/soundpass-recv"
          curl --fail --location --retry 3 \
            -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$APPIMAGE_ARCH.AppImage"
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="$APPIMAGE_ARCH" ./appimagetool.AppImage "$appdir" \
            "dist/soundpass-$VERSION-linux-$ARTIFACT_ARCH.AppImage"
          set +e
          appimage_diagnostics="$(APPIMAGE_EXTRACT_AND_RUN=1 \
            "dist/soundpass-$VERSION-linux-$ARTIFACT_ARCH.AppImage" send --devices 2>&1)"
          appimage_status=$?
          set -e
          if grep -q "error while loading shared libraries" <<<"$appimage_diagnostics"; then
            echo "$appimage_diagnostics" >&2
            exit 1
          fi
          if [[ $appimage_status -ne 0 ]] && ! grep -Eq "PulseAudio|PipeWire" <<<"$appimage_diagnostics"; then
            echo "$appimage_diagnostics" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.artifact_arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64
      - name: Build binaries
        run: cargo build --release --locked --bins
      - name: Test Windows process-loopback selection
        run: cargo test --release --locked
      - name: Install installer toolchains
        shell: powershell
        run: |
          choco install wixtoolset --yes --no-progress
          choco install innosetup --yes --no-progress
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package Windows artifacts
        shell: powershell
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist, stage, wixobj | Out-Null
          Copy-Item target/release/soundpass-send.exe stage/
          Copy-Item target/release/soundpass-recv.exe stage/
          Copy-Item README.md, LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/soundpass-$env:VERSION-windows-x86_64_portable.zip"

          candle.exe -nologo -arch x64 "-dVersion=$env:VERSION" "-dSourceDir=$((Resolve-Path stage).Path)" -out wixobj/ packaging/windows/soundpass.wxs
          light.exe -nologo -spdb -out "dist/soundpass-$env:VERSION-windows-x86_64_setup.msi" wixobj/soundpass.wixobj

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$((Resolve-Path stage).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" packaging/windows/soundpass.iss
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact_arch: x86_64
          - runner: macos-15
            artifact_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.artifact_arch }}
      - name: Build binaries
        run: cargo build --release --locked --bins
      - name: Package macOS artifacts
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          package_name="soundpass-$VERSION-$ARTIFACT_ARCH-macOS"
          mkdir -p dist "$package_name" pkgroot/usr/local/bin pkgroot/usr/local/share/doc/soundpass
          cp target/release/soundpass-send target/release/soundpass-recv "$package_name/"
          cp README.md LICENSE "$package_name/"
          ditto -c -k --sequesterRsrc --keepParent "$package_name" "dist/$package_name.zip"

          cp target/release/soundpass-send target/release/soundpass-recv pkgroot/usr/local/bin/
          cp README.md LICENSE pkgroot/usr/local/share/doc/soundpass/
          pkgbuild --root pkgroot \
            --identifier com.bibiparrot.soundpass \
            --version "$VERSION" \
            --install-location / \
            "dist/$package_name.pkg"
          hdiutil create -volname SoundPass \
            -srcfolder "$package_name" -ov -format UDZO \
            "dist/$package_name.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.artifact_arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [metadata, test, linux-to-windows-interop, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: SoundPass ${{ needs.metadata.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
